services:

  api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    depends_on:

      # API depends on MLFLOW and Trainer because Trainer logs the model to MLFlow, and the API needs to load the model from MLFlow to serve predictions.

      mlflow:
        condition: service_started
      trainer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  mlflow:
    build: .
    command: mlflow server --artifacts-destination ./mlruns --host 0.0.0.0 --port 5000

    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/ || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  trainer:
    build: .
    depends_on:
      mlflow:
        condition: service_started
    command: python src/farm_detection/models/training.py
#    environment:
#      - MLFLOW_TRACKING_URI=http://mlflow:5000
